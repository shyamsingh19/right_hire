; Runs the FastAPI API and the RQ worker as one process group inside a single
; container, so a single Render Web Service (the only free service type) can
; host both. Local dev and docker-compose.yml are untouched — they still run
; `app` and `worker` as separate containers via the Dockerfile's default CMD.
;
; Render sets $PORT at runtime; supervisor expands %(ENV_PORT)s into it.
; If the worker crashes it restarts on its own (autorestart=true) without
; taking uvicorn down with it, and vice versa.

[supervisord]
nodaemon=true
loglevel=info

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/bin/sh -c "rq worker --with-scheduler --url $(python -c 'from app.config import settings; print(settings.effective_redis_url)') ats"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
