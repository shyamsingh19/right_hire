# Both services are stateless — MySQL and Redis are managed, not containers here.
# MySQL: filess.io (DATABASE_URL), Redis: Upstash (UPSTASH_REDIS_REST_*), both from .env.
# Nothing in this file listens on 3306/6379, so there's no local infra to start first.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - storage_data:/app/storage
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - storage_data:/app/storage
    # alembic upgrade head here too, not just in `app` — both containers start together
    # with no ordering guarantee, and this is what runs the pipeline that just broke
    # (schema drift) if only one of the two ever migrated.
    command: >
      sh -c "alembic upgrade head && rq worker --with-scheduler --url $$(python -c 'from app.config import settings; print(settings.effective_redis_url)') ats"

volumes:
  storage_data:
