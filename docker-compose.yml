# Both services are stateless — MySQL and Redis are managed, not containers here.
# MySQL: filess.io (DATABASE_URL), Redis: Upstash (UPSTASH_REDIS_REST_*), both from .env.
# Nothing in this file listens on 3306/6379, so there's no local infra to start first.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - storage_data:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - storage_data:/app/storage
    command: >
      sh -c "rq worker --with-scheduler --url $$(python -c 'from app.config import settings; print(settings.effective_redis_url)') ats"

volumes:
  storage_data:
