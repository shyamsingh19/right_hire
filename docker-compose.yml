version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Overrides any UPSTASH_*/REDIS_URL from .env so the container always talks to the
    # compose-managed redis service by its network name, not localhost or a cloud URL.
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPSTASH_REDIS_REST_URL=
      - UPSTASH_REDIS_REST_TOKEN=
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - storage_data:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPSTASH_REDIS_REST_URL=
      - UPSTASH_REDIS_REST_TOKEN=
    volumes:
      - .:/app
      - storage_data:/app/storage
    command: >
      sh -c "rq worker --url $$(python -c 'from app.config import settings; print(settings.effective_redis_url)') ats"

volumes:
  storage_data:
